name: Publish to pub.dev

# Triggered automatically when the version workflow pushes a tag like v1.2.3.
# Uses the official dart-lang reusable workflow which handles OIDC auth with
# pub.dev — no stored secrets needed.
#
# One-time pub.dev setup (Admin → Automated publishing → GitHub Actions):
#   Repository:    ensendco/ensend-flutter
#   Workflow file: .github/workflows/publish.yml
#   Tag pattern:   v{{version}}
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write # Required for OIDC authentication with pub.dev
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1

name: Version & Publish

# Triggers on every push to main — which includes merged pull requests.
# GitHub natively skips workflows when the commit message contains "[skip ci]",
# so the version-bump commit this workflow creates will not trigger a second run.
on:
  push:
    branches: [main]

# contents:write — push version-bump commit + tag back to main
# id-token:write — exchange for a pub.dev OIDC token (no stored secrets needed)
permissions:
  id-token: write
  contents: write

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  Version bump rules (read from the merge commit message)                    │
# │                                                                             │
# │  "BREAKING CHANGE" anywhere → major  (1.2.3 → 2.0.0)                      │
# │  starts with "feat:"        → minor  (1.2.3 → 1.3.0)                      │
# │  anything else              → patch  (1.2.3 → 1.2.4)                      │
# │                                                                             │
# │  The bump only happens when the local pubspec.yaml version already exists  │
# │  on pub.dev (i.e. no manual bump was made on this branch).                 │
# │  If the local version is already ahead of pub.dev it is published as-is.   │
# │                                                                             │
# │  One-time GitHub setup so the bot can push to a protected main branch:     │
# │    Settings → Branches → main protection rule                              │
# │    → "Allow specified actors to bypass required pull requests"             │
# │    → add "github-actions[bot]"                                             │
# └─────────────────────────────────────────────────────────────────────────────┘

jobs:
  version-and-publish:
    name: Bump version & publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      # ── Quality gates ─────────────────────────────────────────────────────
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test --reporter=github

      # ── Decide whether to bump ────────────────────────────────────────────
      # Compare the local pubspec.yaml version against the latest published
      # version on pub.dev. If they are the same the local version is already
      # live and we must bump. If the local version is already ahead (manual
      # bump committed to this PR) we publish it as-is without bumping again.
      - name: Check pub.dev version
        id: pubcheck
        run: |
          PACKAGE=$(grep '^name:' pubspec.yaml | awk '{print $2}')
          LOCAL=$(grep '^version:' pubspec.yaml | awk '{print $2}')

          PUBLISHED=$(
            curl --silent --fail \
              "https://pub.dev/api/packages/${PACKAGE}" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print(d.get('latest', {}).get('version', '0.0.0'))
          " 2>/dev/null || echo "0.0.0"
          )

          echo "local=$LOCAL"
          echo "published=$PUBLISHED"
          echo "local=$LOCAL"     >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "needs_bump=true"  >> "$GITHUB_OUTPUT"
            echo "Version $LOCAL is already on pub.dev — will auto-bump."
          else
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
            echo "Local version $LOCAL is ahead of pub.dev ($PUBLISHED) — publishing as-is."
          fi

      # ── Determine bump type ───────────────────────────────────────────────
      - name: Determine bump type
        id: bump
        if: steps.pubcheck.outputs.needs_bump == 'true'
        run: |
          MSG="${{ github.event.head_commit.message }}"

          if echo "$MSG" | grep -q "BREAKING CHANGE"; then
            BUMP=major
          elif echo "$MSG" | grep -iE "^feat(\(.*\))?!?:" > /dev/null; then
            BUMP=minor
          else
            BUMP=patch
          fi

          echo "type=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Bump type: $BUMP"

      # ── Bump pubspec.yaml version by exactly one step ─────────────────────
      - name: Bump version
        id: version
        if: steps.pubcheck.outputs.needs_bump == 'true'
        run: |
          CURRENT="${{ steps.pubcheck.outputs.local }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "${{ steps.bump.outputs.type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW="$MAJOR.$MINOR.$PATCH"
          sed -i "s|^version:.*|version: $NEW|" pubspec.yaml

          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumped $CURRENT → $NEW (${{ steps.bump.outputs.type }})"

      # When no bump was needed the "new" version is whatever is in pubspec.yaml
      - name: Resolve final version
        id: final
        run: |
          if [ "${{ steps.pubcheck.outputs.needs_bump }}" = "true" ]; then
            echo "version=${{ steps.version.outputs.new }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.pubcheck.outputs.local }}" >> "$GITHUB_OUTPUT"
          fi

      # ── Update CHANGELOG.md ───────────────────────────────────────────────
      # Pass all dynamic values as environment variables so the Python script
      # never interpolates user-controlled strings (commit messages can contain
      # newlines, quotes, and backslashes that would break a heredoc f-string).
      - name: Update CHANGELOG.md
        env:
          NEW_VERSION: ${{ steps.final.outputs.version }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PYEOF'
          import re, pathlib, os
          from datetime import date

          new_ver   = os.environ["NEW_VERSION"]
          commit    = os.environ["COMMIT_MSG"]
          today     = date.today().isoformat()

          # Strip "[skip ci]" and stray whitespace from the commit message
          clean = re.sub(r'\[skip ci\]', '', commit, flags=re.IGNORECASE).strip()

          path    = pathlib.Path("CHANGELOG.md")
          content = path.read_text()

          # Only prepend if this version isn't already in the file
          if f"## [{new_ver}]" in content:
              print(f"Version {new_ver} already in CHANGELOG.md — skipping.")
          else:
              entry   = f"## [{new_ver}] - {today}\n\n{clean}\n\n---\n\n"
              updated = re.sub(r"(---\s*\n)", entry, content, count=1)
              path.write_text(updated)
              print(f"Prepended {new_ver} to CHANGELOG.md")
          PYEOF

      # ── Commit, tag, and push ─────────────────────────────────────────────
      # "[skip ci]" in the commit message tells GitHub Actions (and most CI
      # providers) to skip all workflow runs triggered by this push, preventing
      # an infinite loop.
      - name: Commit and tag
        run: |
          FINAL="${{ steps.final.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml CHANGELOG.md
          # --allow-empty guards against the case where nothing changed
          # (e.g. CHANGELOG entry already existed and version was already ahead)
          git diff --cached --quiet && echo "Nothing to commit." || \
            git commit -m "chore: bump version to $FINAL [skip ci]"
          git tag "v$FINAL" 2>/dev/null || echo "Tag v$FINAL already exists."
          git push origin main --follow-tags

      # ── Publish ───────────────────────────────────────────────────────────
      - name: Dry-run publish
        run: dart pub publish --dry-run

      # Requires automated publishing enabled on pub.dev:
      #   pub.dev → ensend_flutter → Admin → Automated publishing
      #   → Enable GitHub Actions → repository: ensend/ensend-dart
      #   → workflow file: .github/workflows/publish.yml
      - name: Publish to pub.dev
        run: dart pub publish --force

name: Version & Publish

# Triggers on every push to main — which includes merged pull requests.
# GitHub natively skips any workflow when the commit message contains
# "[skip ci]", so the version-bump commit this workflow creates won't
# trigger a second run.
on:
  push:
    branches: [main]

# ── Permissions ───────────────────────────────────────────────────────────────
# contents:write  — push the version-bump commit + tag back to main
# id-token:write  — exchange for a pub.dev OIDC token (no stored secrets)
permissions:
  id-token: write
  contents: write

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  Version bump rules (read from merge commit message)                        │
# │                                                                             │
# │  "BREAKING CHANGE" anywhere in message → major bump  (1.0.0 → 2.0.0)      │
# │  message starts with "feat:"           → minor bump  (0.1.0 → 0.2.0)      │
# │  anything else                         → patch bump  (0.1.0 → 0.1.1)      │
# │                                                                             │
# │  One-time GitHub setup required so the bot can push to protected main:     │
# │    Settings → Branches → main protection rule                              │
# │    → "Allow specified actors to bypass required pull requests"             │
# │    → add "github-actions[bot]"                                             │
# └─────────────────────────────────────────────────────────────────────────────┘

jobs:
  version-and-publish:
    name: Bump version & publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history lets git push back; GITHUB_TOKEN write access is set
          # via the permissions block above.
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      # ── Quality gates (mirror ci.yml) ─────────────────────────────────────
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test --reporter=github

      # ── Determine version bump type ───────────────────────────────────────
      # Reads the HEAD commit message (= the merge commit for a squash/merge PR).
      - name: Determine bump type
        id: bump
        run: |
          MSG="${{ github.event.head_commit.message }}"

          if echo "$MSG" | grep -q "BREAKING CHANGE"; then
            BUMP=major
          elif echo "$MSG" | grep -iE "^feat(\(.*\))?!?:" > /dev/null; then
            BUMP=minor
          else
            BUMP=patch
          fi

          echo "type=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Bump type: $BUMP"

      # ── Bump version in pubspec.yaml ──────────────────────────────────────
      - name: Bump version
        id: version
        run: |
          CURRENT=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "${{ steps.bump.outputs.type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW="$MAJOR.$MINOR.$PATCH"
          # Use a delimiter that won't clash with version strings
          sed -i "s|^version:.*|version: $NEW|" pubspec.yaml

          echo "previous=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW"          >> "$GITHUB_OUTPUT"
          echo "Bumped $CURRENT → $NEW (${{ steps.bump.outputs.type }})"

      # ── Commit and tag ────────────────────────────────────────────────────
      # "[skip ci]" prevents this commit from triggering another workflow run.
      - name: Commit version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${{ steps.version.outputs.new }} [skip ci]"
          git tag "v${{ steps.version.outputs.new }}"
          git push origin main --follow-tags

      # ── Publish ───────────────────────────────────────────────────────────
      # Dry-run first to catch packaging errors before touching pub.dev.
      - name: Dry-run publish
        run: dart pub publish --dry-run

      # Requires automated publishing to be enabled on pub.dev:
      #   pub.dev → ensend_flutter → Admin → Automated publishing
      #   → Enable GitHub Actions → repository: ensend/ensend-dart
      #   → workflow: .github/workflows/publish.yml
      - name: Publish to pub.dev
        run: dart pub publish --force

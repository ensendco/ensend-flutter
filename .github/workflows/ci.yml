name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  Job pipeline                                                               │
# │                                                                             │
# │  format ──► analyze ──► test (4 suites × stable + beta) ──► coverage       │
# │                                                                             │
# │  Required status checks to add in GitHub branch protection:                │
# │    ✓ Format                                                                 │
# │    ✓ Analyze                                                                │
# │    ✓ Test / api (stable)   ✓ Test / api (beta)                             │
# │    ✓ Test / http (stable)  ✓ Test / http (beta)                            │
# │    ✓ Test / models (stable) ✓ Test / models (beta)                         │
# │    ✓ Test / utils (stable) ✓ Test / utils (beta)                           │
# │    ✓ Coverage (≥ 80 %)                                                      │
# └─────────────────────────────────────────────────────────────────────────────┘

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # 1 · FORMAT
  # ────────────────────────────────────────────────────────────────────────────
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

  # ────────────────────────────────────────────────────────────────────────────
  # 2 · ANALYZE
  # ────────────────────────────────────────────────────────────────────────────
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    needs: format

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Static analysis (fatal infos)
        run: dart analyze --fatal-infos

  # ────────────────────────────────────────────────────────────────────────────
  # 3 · TEST
  #   Matrix: 4 suites × 2 SDK channels = 8 parallel jobs.
  #   Each suite maps to a test directory (or a glob for root-level tests).
  #   fail-fast: false → all legs run to completion so every failure is visible.
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Test / ${{ matrix.suite.name }} (${{ matrix.dart-version }})
    runs-on: ubuntu-latest
    needs: analyze

    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: api
            path: test/api
          - name: http
            path: test/http
          - name: models
            path: test/models
          - name: utils
            path: test/utils
        dart-version: [stable, beta]

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.dart-version }}

      - name: Install dependencies
        run: dart pub get

      - name: Run ${{ matrix.suite.name }} tests
        run: dart test ${{ matrix.suite.path }} --reporter=github

  # ────────────────────────────────────────────────────────────────────────────
  # 4 · COVERAGE
  #   Runs the full suite (all paths) and fails if line coverage < THRESHOLD.
  #   Uploads lcov.info as an artifact for local inspection.
  # ────────────────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage (≥ 80 %)
    runs-on: ubuntu-latest
    needs: test
    env:
      THRESHOLD: 80

    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: api
            path: test/api
          - name: dio
            path: test/dio
          - name: http
            path: test/http
          - name: models
            path: test/models
          - name: utils
            path: test/utils

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Run ${{ matrix.suite.name }} tests with coverage
        run: dart test ${{ matrix.suite.path }} --coverage=coverage/${{ matrix.suite.name }}

      - name: Convert to LCOV
        run: |
          dart run coverage:format_coverage \
            --lcov \
            --in=coverage/${{ matrix.suite.name }} \
            --out=coverage/${{ matrix.suite.name }}/lcov.info \
            --packages=.dart_tool/package_config.json \
            --report-on=lib

      - name: Check coverage threshold
        run: |
          LINES=$(lcov --summary coverage/${{ matrix.suite.name }}/lcov.info 2>&1 \
            | grep "lines" \
            | grep -oP '\d+\.\d+(?=%)')
          echo "${{ matrix.suite.name }} line coverage: $LINES %"
          python3 -c "
          import sys
          pct = float('$LINES')
          threshold = $THRESHOLD
          print(f'Coverage {pct:.1f}% vs threshold {threshold}%')
          sys.exit(0 if pct >= threshold else 1)
          "

      - name: Upload ${{ matrix.suite.name }} coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov-${{ matrix.suite.name }}
          path: coverage/${{ matrix.suite.name }}/lcov.info
          retention-days: 14

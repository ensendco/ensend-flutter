name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  Job pipeline                                                               │
# │                                                                             │
# │  format ──► analyze ──► test (4 suites × stable + beta) ──► coverage       │
# │                                                                             │
# │  Required status checks to add in GitHub branch protection:                │
# │    ✓ Format                                                                 │
# │    ✓ Analyze                                                                │
# │    ✓ Test / api (stable)    ✓ Test / api (beta)                            │
# │    ✓ Test / http (stable)   ✓ Test / http (beta)                           │
# │    ✓ Test / models (stable) ✓ Test / models (beta)                         │
# │    ✓ Test / utils (stable)  ✓ Test / utils (beta)                          │
# │    ✓ Coverage (≥ 80 %)                                                      │
# └─────────────────────────────────────────────────────────────────────────────┘

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # 1 · FORMAT
  # ────────────────────────────────────────────────────────────────────────────
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

  # ────────────────────────────────────────────────────────────────────────────
  # 2 · ANALYZE
  # ────────────────────────────────────────────────────────────────────────────
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    needs: format

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Static analysis (fatal infos)
        run: dart analyze --fatal-infos

  # ────────────────────────────────────────────────────────────────────────────
  # 3 · TEST
  #   Matrix: 4 suites × 2 SDK channels = 8 parallel jobs.
  #   fail-fast: false → all legs finish so every failure surfaces at once.
  #   --reporter=github → failures appear as inline PR diff annotations.
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Test / ${{ matrix.suite.name }} (${{ matrix.dart-version }})
    runs-on: ubuntu-latest
    needs: analyze

    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: api
            path: test/api
          - name: http
            path: test/http
          - name: models
            path: test/models
          - name: utils
            path: test/utils
        dart-version: [stable, beta]

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.dart-version }}

      - name: Install dependencies
        run: dart pub get

      - name: Run ${{ matrix.suite.name }} tests
        run: dart test ${{ matrix.suite.path }} --reporter=github

  # ────────────────────────────────────────────────────────────────────────────
  # 4 · COVERAGE
  #   Runs the FULL test suite in one job (no matrix) so every lib file is
  #   exercised and the overall line-coverage figure is meaningful.
  #
  #   The threshold check uses Python to parse the LCOV file directly —
  #   no `lcov` binary required on the runner.
  #
  #   Adjust THRESHOLD to raise or lower the gate.
  # ────────────────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage (≥ 80 %)
    runs-on: ubuntu-latest
    needs: test
    env:
      THRESHOLD: 80

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Run full test suite with coverage
        run: dart test --coverage=coverage

      - name: Convert to LCOV
        run: |
          dart run coverage:format_coverage \
            --lcov \
            --in=coverage \
            --out=coverage/lcov.info \
            --packages=.dart_tool/package_config.json \
            --report-on=lib

      - name: Check coverage threshold
        run: |
          python3 - <<'EOF'
          import sys, os

          lcov_path = 'coverage/lcov.info'
          if not os.path.exists(lcov_path):
              print('ERROR: lcov.info not found')
              sys.exit(1)

          lines_found = 0
          lines_hit   = 0
          with open(lcov_path) as f:
              for line in f:
                  line = line.strip()
                  if line.startswith('LF:'):
                      lines_found += int(line[3:])
                  elif line.startswith('LH:'):
                      lines_hit += int(line[3:])

          if lines_found == 0:
              print('WARNING: no instrumented lines found — skipping threshold check')
              sys.exit(0)

          threshold = int(os.environ['THRESHOLD'])
          pct = lines_hit / lines_found * 100
          print(f'Line coverage: {lines_hit}/{lines_found} = {pct:.1f}%  (threshold: {threshold}%)')
          sys.exit(0 if pct >= threshold else 1)
          EOF

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov-report
          path: coverage/lcov.info
          retention-days: 14
